<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif" font-size="15">
  <title>Earth seen from above the North Pole, spinning counterclockwise</title>
  <desc>Sunlight comes from the left. Earth is viewed from above the North Pole and spins counterclockwise (west to east). A person standing on Earth is shown at four places: noon facing the Sun, sunset at the bottom edge moving into the dark, midnight on the far side, and sunrise at the top edge moving into the light. Not to scale.</desc>
  <rect width="640" height="400" fill="#0b1020"/>
  <defs>
    <marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffe680"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
  </defs>
  <g stroke="#ffe680" stroke-width="2" marker-end="url(#s)">
    <line x1="20" y1="140" x2="190" y2="140"/>
    <line x1="20" y1="200" x2="190" y2="200"/>
    <line x1="20" y1="260" x2="190" y2="260"/>
  </g>
  <text x="20" y="120" fill="#ffe680">sunlight from the Sun</text>
  <!-- Earth from above -->
  <circle cx="380" cy="200" r="120" fill="#1a2a4a"/>
  <path d="M380,80 A120,120 0 0 0 380,320 Z" fill="#3a8fd9"/>
  <circle cx="380" cy="200" r="5" fill="#ffffff"/>
  <text x="390" y="196" fill="#ffffff" font-size="13">North Pole</text>
  <!-- rotation arrow, counterclockwise as seen from above -->
  <path d="M480,105 A150,150 0 0 0 290,85" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#r)"/>
  <text x="440" y="60" fill="#ffffff">spins west to east</text>
  <!-- four positions of one person -->
  <g fill="#ff6b6b">
    <circle cx="260" cy="200" r="7"/>
    <circle cx="380" cy="80" r="7"/>
    <circle cx="500" cy="200" r="7"/>
    <circle cx="380" cy="320" r="7"/>
  </g>
  <text x="215" y="232" fill="#ffffff">noon</text>
  <text x="392" y="106" fill="#ffffff">sunrise</text>
  <text x="512" y="205" fill="#ffffff">midnight</text>
  <text x="392" y="310" fill="#ffffff">sunset</text>
  <text x="20" y="390" fill="#9fb3d9" font-size="13">One person (red dot) carried around by the spin: about 24 hours for the full trip. Not to scale.</text>
</svg>
