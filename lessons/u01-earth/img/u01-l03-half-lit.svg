<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="sans-serif" font-size="15">
  <title>Sunlight lights one half of Earth at a time</title>
  <desc>Parallel arrows of sunlight come from the left. The left half of Earth is bright (day); the right half is dark (night). The line between them is labelled the terminator. Not to scale.</desc>
  <rect width="640" height="320" fill="#0b1020"/>
  <!-- Sun (not to scale) -->
  <circle cx="20" cy="160" r="90" fill="#ffcc33"/>
  <text x="20" y="300" fill="#ffcc33">Sun (much bigger and farther in real life)</text>
  <!-- sunlight arrows -->
  <g stroke="#ffe680" stroke-width="2" marker-end="url(#a)">
    <line x1="130" y1="90" x2="330" y2="90"/>
    <line x1="130" y1="130" x2="330" y2="130"/>
    <line x1="130" y1="170" x2="330" y2="170"/>
    <line x1="130" y1="210" x2="330" y2="210"/>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffe680"/></marker></defs>
  <text x="150" y="70" fill="#ffe680">sunlight</text>
  <!-- Earth -->
  <circle cx="460" cy="155" r="100" fill="#1a2a4a"/>
  <path d="M460,55 A100,100 0 0 0 460,255 Z" fill="#3a8fd9"/>
  <line x1="460" y1="45" x2="460" y2="265" stroke="#ffffff" stroke-dasharray="6,5" stroke-width="2"/>
  <text x="395" y="160" fill="#ffffff" font-weight="bold">DAY</text>
  <text x="480" y="160" fill="#9fb3d9" font-weight="bold">NIGHT</text>
  <text x="380" y="285" fill="#ffffff">terminator (sunrise/sunset line)</text>
</svg>
