name: Manor Sunrise
on: pull_request
permissions:
  contents: read
jobs:
  sunrise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/manor-sunrise.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install selenium==4.29.0
      - run: python tests/manor-sunrise-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manor-sunrise-screenshots
          path: sunrise-captures/
