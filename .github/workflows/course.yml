name: Course checks
on: pull_request
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0
      - run: python tests/check_course.py
      - name: Show textbook coverage
        run: cat syllabus/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: textbook-coverage
          path: syllabus/coverage.md
      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir . --include-fragments './**/*.md'
          fail: true
      - name: Check external Markdown links
        id: external
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --exclude-private --timeout 12 --max-retries 1 './**/*.md'
          fail: true
      - name: Flag unreachable links
        if: steps.external.outcome == 'failure'
        run: echo "::warning::Some external links were unreachable. See the link-check output."
